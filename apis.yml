aid: approvecom
name: Approve.com
description: >-
  Approve.com is a cloud-based procurement platform founded in 2019 in Israel that lets
  businesses stand up a proper purchase-order process quickly, streamlining purchase
  requisitions, multi-step approvals, real-time budgets, and vendor onboarding with
  real-time spend controls and insights. Tipalti acquired Approve.com in April 2021 and
  now operates it as Tipalti Procurement (Tipalti Approve). Its Procurement REST API is
  still served from the approve.com domain (production https://triggers.approve.com,
  sandbox https://triggers.sandbox.approve.com), authenticating with an x-api-key header
  and exchanging JSON with ISO 8601 dates; the purchase-orders API exposes GET and Update
  purchase-order operations so an external system can stay in sync with Tipalti.
